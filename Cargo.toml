[package]
name = "flamelang"
version = "0.5.8"
edition = "2024"
description = "A statically typed, fast, and modern programming language built in Rust."
license = "ISC"
repository = "https://github.com/shoya-129/flame"
documentation = "https://flamelang.vercel.app/"
keywords = ["compiler", "flame", "language", "scripting"]
categories = ["command-line-utilities", "compilers"]
exclude = [
    "/examples/",
    "/docs/",
    "/bin/",
    "/scripts/",
    "/ide/"
]

[[bin]]
name = "flamelang"
path = "src/main.rs"

[features]
default = ["cli", "net", "http", "ws", "mqtt", "utils", "os", "automation", "regex", "hardware", "camera", "base64"]
cli = ["dep:reqwest", "dep:zip"]
avr = []
esp32 = []
rp2040 = []
stm32 = []
net = ["dep:tokio", "dep:reqwest", "dep:tungstenite", "dep:tokio-tungstenite", "dep:futures-util", "dep:url", "dep:default-net"]
mqtt = ["net", "dep:rumqttc"]
http = ["net"]
ws = ["net", "dep:tokio-tungstenite", "dep:futures-util"]
utils = ["dep:chrono", "dep:base64"]
os = ["dep:sysinfo", "dep:enigo"]
automation = ["os"]
regex = []
hardware = ["dep:btleplug", "dep:serialport", "dep:sysinfo"]
camera = ["dep:nokhwa", "dep:image"]
base64 = ["dep:base64"]

[dependencies]
tokio = { version = "1", optional = true, features = ["rt", "macros", "net", "time", "sync", "io-util", "rt-multi-thread"] }
tungstenite = { version = "0.24", optional = true, features = ["rustls-tls-webpki-roots"] }
tokio-tungstenite = { version = "0.24", optional = true, features = ["rustls-tls-webpki-roots"] }
futures-util = { version = "0.3", optional = true, default-features = false, features = ["sink"] }
rumqttc = { version = "0.25.1", optional = true }
url = { version = "2.5", optional = true }
default-net = { version = "0.22", optional = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
enigo = { version = "0.6.1", optional = true }
sysinfo = { version = "=0.30.0", optional = true }
serialport = { version = "4", optional = true }
nokhwa = { version = "0.10", features = ["input-native"], optional = true }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "bmp"], optional = true }
btleplug = { version = "0.12.0", optional = true }
futures = { version = "0.3", default-features = false, features = ["executor"], optional = true }
once_cell = "1.21"
regex = "1.13.1"
reqwest = { version = "0.13.4", optional = true, default-features = false, features = ["default-tls", "json", "multipart", "blocking"] }
zip = { version = "8.6.0", optional = true }
syn = { version = "3.0.0", features = ["full"] }
quote = "1.0"
proc-macro2 = "1.0"
ctrlc = "3.5.2"
chrono = { version = "0.4.45", optional = true }
base64 = { version = "0.23.1", optional = true }
dotenvy = "0.15.7"

[target.'cfg(target_os = "linux")'.dependencies]
x11rb = "0.14.0"
dbus = "0.9"
libc = "0.2"

[profile.dev]
opt-level = 0
split-debuginfo = "unpacked"
incremental = true
codegen-units = 256

[profile.dev.package."*"]
opt-level = 2

[profile.release]
strip = true
lto = "thin"
codegen-units = 16
opt-level = 3
