[package]
name = "flamebinder"
version = "0.1.3"
edition = "2024"
description = "Official Rust integration crate for the Flame programming language."
license = "ISC"
repository = "https://github.com/shoya-129/flamelang"
homepage = "https://flamelang.vercel.app"

[features]
default = ["std"]
std = [
    "flamelang/utils",
    "flamelang/net",
    "flamelang/http",
    "flamelang/ws",
    "flamelang/cli",
    "flamelang/regex",
    "flamelang/base64",
    "flamelang/utils",
]
full = [
    "std",
    "flamelang/os",
    "flamelang/automation",
    "flamelang/hardware",
    "flamelang/camera",
    "flamelang/mqtt",
]

[dependencies]
flamelang = { version = "0.6.3", path = "..", default-features = false }

[dev-dependencies]
tempfile = "3.27.0"
